# VideoRAG full stack. Set OPENROUTER_API_KEY in your shell (or a .env file next
# to this compose file), then: docker compose up --build
services:
  backend:
    build: ./backend
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_VISION_MODEL: ${DEFAULT_VISION_MODEL:-openai/gpt-4o-mini}
      # OpenRouter serves /embeddings, so the same key is reused (leave
      # EMBEDDING_API_KEY blank → falls back to OPENROUTER_API_KEY).
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - videorag_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/v1/health'); "]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  videorag_data:
