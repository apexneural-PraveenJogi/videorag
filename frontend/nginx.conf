server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend service. Large bodies for video upload (5 GB cap,
    # matching MAX_VIDEO_SIZE_MB on the backend).
    location /api/ {
        proxy_pass http://api.videorag.apexneural.cloud/api/;
        proxy_set_header Host api.videorag.apexneural.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 5g;
        # Stream big uploads straight through instead of buffering to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # SSE streaming (token-by-token answers)
        proxy_buffering off;
    }
}
